<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Şifreni sıfırla — Cashcep</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --ink: #1B3A3A;
    --ink-2: #122828;
    --paper: #F7F3EC;
    --paper-2: #EFE8D8;
    --gold: #C89B3C;
    --line: #DDD3BC;
    --charcoal: #2A2A28;
    --muted: #7A7266;
    --coral: #C25B4A;
    --sage: #5B8C6E;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 100%);
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px; min-height: 100vh;
  }
  .card {
    background: var(--paper);
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; color: var(--ink);
    margin-bottom: 22px;
  }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 23px; font-weight: 600; color: var(--ink);
    margin: 0 0 8px;
  }
  p.sub {
    font-size: 14px; color: var(--muted); line-height: 1.5;
    margin: 0 0 24px;
  }
  label {
    display: block; font-size: 12.5px; color: var(--muted);
    margin-bottom: 6px; margin-top: 16px; font-weight: 600;
  }
  input[type="password"] {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; font-size: 15px; background: white; color: var(--charcoal);
    font-family: inherit;
  }
  input[type="password"]:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  button {
    width: 100%; border: none; border-radius: 10px; padding: 14px;
    background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 700;
    margin-top: 24px; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg {
    border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.5;
    margin-top: 16px; display: none;
  }
  .msg.show { display: block; }
  .msg.error { background: #FBE7E3; color: #8A2E1F; }
  .msg.success { background: #E9F1EA; color: #2E5B3D; }
  .success-state { text-align: center; display: none; }
  .success-state.show { display: block; }
  .success-state .ring-wrap { width: 72px; height: 72px; margin: 0 auto 18px; }
  .form-state.hide { display: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="brand-dot"></span>Cashcep</div>

    <div class="form-state" id="formState">
      <h1 id="formTitle">Yeni şifre belirle</h1>
      <p class="sub" id="formSub">Hesabın için yeni bir şifre gir. En az 6 karakter olmalı.</p>

      <label for="pw1" id="labelPw1">Yeni şifre</label>
      <input type="password" id="pw1" autocomplete="new-password" />

      <label for="pw2" id="labelPw2">Yeni şifreyi tekrar gir</label>
      <input type="password" id="pw2" autocomplete="new-password" />

      <div class="msg" id="msgBox"></div>

      <button id="submitBtn">Şifreyi güncelle</button>
    </div>

    <div class="success-state" id="successState">
      <div class="ring-wrap">
        <svg width="72" height="72" viewBox="0 0 92 92" fill="none">
          <circle cx="46" cy="46" r="38" stroke="var(--line)" stroke-width="7"/>
          <circle cx="46" cy="46" r="38" stroke="var(--gold)" stroke-width="7" stroke-linecap="round"/>
          <path d="M31 47 L41 57 L63 33" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
      </div>
      <h1 id="successTitle">Şifren güncellendi</h1>
      <p class="sub" id="successSub">Artık Cashcep uygulamasına yeni şifrenle giriş yapabilirsin. Bu sekmeyi kapatabilirsin.</p>
    </div>
  </div>

  <script>
    var SUPABASE_URL = "https://reyrfirwjsiocvmxzyqq.supabase.co";
    var SUPABASE_ANON_KEY = "sb_publishable_4r4NLaKBKyq1iQhjV2QHTA_MF0X0FDH";

    var isTr = (navigator.language || "").toLowerCase().indexOf("tr") === 0;
    var STR = isTr ? {
      formTitle: "Yeni şifre belirle",
      formSub: "Hesabın için yeni bir şifre gir. En az 6 karakter olmalı.",
      labelPw1: "Yeni şifre",
      labelPw2: "Yeni şifreyi tekrar gir",
      submitBtn: "Şifreyi güncelle",
      successTitle: "Şifren güncellendi",
      successSub: "Artık Cashcep uygulamasına yeni şifrenle giriş yapabilirsin. Bu sekmeyi kapatabilirsin.",
      errShort: "Şifre en az 6 karakter olmalı.",
      errMismatch: "Şifreler eşleşmiyor.",
      errNoToken: "Geçersiz veya süresi dolmuş link. Uygulamadan tekrar 'şifremi unuttum' dene.",
      errGeneric: "Bir şeyler ters gitti, tekrar dene."
    } : {
      formTitle: "Set a new password",
      formSub: "Enter a new password for your account. Must be at least 6 characters.",
      labelPw1: "New password",
      labelPw2: "Confirm new password",
      submitBtn: "Update password",
      successTitle: "Password updated",
      successSub: "You can now log in to Cashcep with your new password. You can close this tab.",
      errShort: "Password must be at least 6 characters.",
      errMismatch: "Passwords don't match.",
      errNoToken: "Invalid or expired link. Try 'forgot password' again from the app.",
      errGeneric: "Something went wrong, please try again."
    };

    document.documentElement.lang = isTr ? "tr" : "en";
    document.getElementById("formTitle").textContent = STR.formTitle;
    document.getElementById("formSub").textContent = STR.formSub;
    document.getElementById("labelPw1").textContent = STR.labelPw1;
    document.getElementById("labelPw2").textContent = STR.labelPw2;
    document.getElementById("submitBtn").textContent = STR.submitBtn;
    document.getElementById("successTitle").textContent = STR.successTitle;
    document.getElementById("successSub").textContent = STR.successSub;

    function getAccessToken() {
      var hash = window.location.hash.substring(1);
      var params = new URLSearchParams(hash);
      return params.get("access_token");
    }

    function showMsg(text, type) {
      var box = document.getElementById("msgBox");
      box.textContent = text;
      box.className = "msg show " + type;
    }

    var accessToken = getAccessToken();
    var btn = document.getElementById("submitBtn");

    if (!accessToken) {
      showMsg(STR.errNoToken, "error");
      btn.disabled = true;
    }

    btn.addEventListener("click", async function () {
      var pw1 = document.getElementById("pw1").value;
      var pw2 = document.getElementById("pw2").value;

      if (!pw1 || pw1.length < 6) {
        showMsg(STR.errShort, "error");
        return;
      }
      if (pw1 !== pw2) {
        showMsg(STR.errMismatch, "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "...";

      try {
        var res = await fetch(SUPABASE_URL + "/auth/v1/user", {
          method: "PUT",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + accessToken,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ password: pw1 })
        });

        if (!res.ok) {
          var err = await res.json().catch(function () { return {}; });
          throw new Error(err.msg || err.error_description || STR.errGeneric);
        }

        document.getElementById("formState").classList.add("hide");
        document.getElementById("successState").classList.add("show");
      } catch (e) {
        showMsg(e.message || STR.errGeneric, "error");
        btn.disabled = false;
        btn.textContent = STR.submitBtn;
      }
    });
  </script>
</body>
</html>
