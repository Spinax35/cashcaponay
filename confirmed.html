<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>E-postan onaylandı — Cashcep</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --ink: #1B3A3A;
    --ink-2: #122828;
    --paper: #F7F3EC;
    --paper-2: #EFE8D8;
    --gold: #C89B3C;
    --gold-light: #EBCB7C;
    --line: #DDD3BC;
    --charcoal: #2A2A28;
    --muted: #7A7266;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, var(--ink) 0%, var(--ink-2) 100%);
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--paper);
    border-radius: 24px;
    padding: 48px 36px 40px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
  }
  .ring-wrap {
    width: 92px; height: 92px;
    margin: 0 auto 26px;
    position: relative;
  }
  svg { display: block; }
  .ring-path {
    stroke-dasharray: 700;
    stroke-dashoffset: 700;
    animation: draw 1.1s cubic-bezier(.65,0,.35,1) forwards;
  }
  .check-path {
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: draw-check 0.5s ease-out 0.9s forwards;
  }
  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes draw-check {
    to { stroke-dashoffset: 0; }
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  p {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.6;
    margin: 0 0 28px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
  }
  .brand-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold);
  }
  .footer-note {
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
    opacity: 0.75;
  }
  @media (prefers-reduced-motion: reduce) {
    .ring-path, .check-path { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="ring-wrap">
      <svg width="92" height="92" viewBox="0 0 92 92" fill="none">
        <circle cx="46" cy="46" r="38" stroke="var(--line)" stroke-width="7"/>
        <circle class="ring-path" cx="46" cy="46" r="38" stroke="var(--gold)" stroke-width="7"
                stroke-linecap="round" transform="rotate(-90 46 46)"/>
        <path class="check-path" d="M31 47 L41 57 L63 33" stroke="var(--ink)" stroke-width="6"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>

    <h1 id="title">E-postan onaylandı</h1>
    <p id="body">
      Hesabın artık aktif. Cashcep uygulamasına dönüp
      gelir-gider takibine kaldığın yerden devam edebilirsin.
    </p>

    <div class="brand">
      <span class="brand-dot"></span>
      Cashcep
    </div>

    <div class="footer-note" id="footer">Bu sekmeyi kapatabilirsin.</div>
  </div>

  <script>
    var isTr = (navigator.language || "").toLowerCase().indexOf("tr") === 0;
    if (!isTr) {
      document.getElementById("title").textContent = "Your email is confirmed";
      document.getElementById("body").textContent =
        "Your account is now active. You can head back to the Cashcep app and pick up right where you left off.";
      document.getElementById("footer").textContent = "You can close this tab.";
      document.documentElement.lang = "en";
    }
  </script>
</body>
</html>
